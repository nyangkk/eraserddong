<script>
const eraser = document.getElementById('eraser');
let ctx = null;
let busy = false;

function place(x, y) {
  eraser.style.left = x + 'px';
  eraser.style.top = y + 'px';
}

place(window.innerWidth * 0.5, window.innerHeight * 0.4);

document.addEventListener('pointermove', (e) => {
  place(e.clientX, e.clientY);
});

function scrub(time) {
  const length = 0.11;
  const buffer = ctx.createBuffer(1, ctx.sampleRate * length, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 2400 + Math.random() * 1600;
  filter.Q.value = 0.8;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(0.5, time + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + length);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  source.start(time);
}

function playSound() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  for (let i = 0; i < 8; i++) {
    scrub(now + 0.06 + i * 0.12);
  }
}

document.addEventListener('click', () => {
  if (busy) return;
  busy = true;
  eraser.classList.add('rub');
  playSound();
});

eraser.querySelector('img').addEventListener('animationend', () => {
  eraser.classList.remove('rub');
  busy = false;
});
</script>
